<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>نظام المراجعة المستمرة</title>
  <style>
    :root {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --border: #334155;
      --danger: #ef4444;
      --success: #10b981;
      --warn: #f59e0b;
    }
    html { scroll-padding-top: env(safe-area-inset-top, 0px); }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg-color); color: var(--text); padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .container { width: 100%; max-width: 800px; }

    header { text-align: center; margin-bottom: 24px; }
    header h1 { font-size: 1.8rem; margin-bottom: 8px; }
    header p { color: var(--text-dim); font-size: .95rem; }

    .sync-bar { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
    .sync-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 18px; border-radius: 999px; border: 1px solid var(--accent);
      background: rgba(59,130,246,.15); color: var(--text); font-size: 1rem; font-weight: bold; cursor: pointer; transition: all .2s;
    }
    .sync-btn:hover { background: var(--accent); }
    .sync-btn:disabled { opacity: .6; cursor: wait; }
    .sync-btn .ico { font-size: 1.3rem; display: inline-block; }
    .sync-btn.spinning .ico { animation: spin 1s linear infinite; }
    .sync-btn.dirty { border-color: var(--warn); background: rgba(245,158,11,.15); }
    .sync-btn.dirty:hover { background: var(--warn); color: #111; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: .8rem; border: 1px solid var(--border); color: var(--text-dim); }
    .status-badge.ok { color: var(--success); border-color: var(--success); }
    .status-badge.warn { color: var(--warn); border-color: var(--warn); }
    .status-badge.err { color: var(--danger); border-color: var(--danger); }

    .add-topic-form { display: flex; gap: 10px; margin-bottom: 30px; }
    .add-topic-form input { flex: 1; min-width: 0; padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text); font-size: 1rem; outline: none; }
    .add-topic-form input:focus { border-color: var(--accent); }
    .btn { padding: 12px 20px; border-radius: 8px; border: none; background: var(--accent); color: #fff; font-weight: bold; cursor: pointer; transition: background .2s; }
    .btn:hover { background: var(--accent-hover); }

    .topics-grid { display: flex; flex-direction: column; gap: 20px; }
    .topic-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    .topic-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .topic-title { font-size: 1.3rem; font-weight: 600; overflow-wrap: anywhere; }
    .topic-counter { font-size: .85rem; color: var(--text-dim); background: rgba(255,255,255,.05); padding: 4px 10px; border-radius: 20px; white-space: nowrap; }
    .topic-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .action-btn { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 8px; border: 1px solid var(--border); background: #2d3748; color: var(--text); font-size: 1.4rem; cursor: pointer; transition: all .2s; }
    .action-btn:hover { background: var(--accent); border-color: var(--accent); }
    .review-group { display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,.2); padding: 4px 8px; border-radius: 10px; border: 1px solid var(--border); }
    .review-select { background: var(--card-bg); color: var(--text); border: 1px solid var(--border); padding: 6px 10px; border-radius: 6px; outline: none; cursor: pointer; }
    .delete-btn { margin-right: auto; background: transparent; border: none; color: var(--danger); cursor: pointer; font-size: .9rem; opacity: .7; }
    .delete-btn:hover { opacity: 1; }

    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85); backdrop-filter: blur(5px); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
    .modal.active { display: flex; }
    .modal-content { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 700px; max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; }
    .modal-header { padding: 15px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .modal-close { background: none; border: none; color: var(--text-dim); font-size: 1.5rem; cursor: pointer; }
    .modal-body { padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; align-items: center; }
    .review-img-card { width: 100%; display: flex; flex-direction: column; align-items: center; background: rgba(0,0,0,.2); border-radius: 12px; padding: 10px; border: 1px solid var(--border); }
    .review-img { max-width: 100%; border-radius: 8px; box-shadow: 0 4px 12px rgba(0,0,0,.3); }
    .img-delete-btn { margin-top: 10px; background: rgba(239,68,68,.15); color: var(--danger); border: 1px solid var(--danger); padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: all .2s; }
    .img-delete-btn:hover { background: var(--danger); color: #fff; }
    .modal-footer { padding: 15px 20px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

    .upload-dialog, .camera-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.8); z-index: 1001; justify-content: center; align-items: center; padding: 20px; }
    .upload-dialog.active, .camera-modal.active { display: flex; }
    .upload-box, .camera-box { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 25px; width: 320px; max-width: 100%; display: flex; flex-direction: column; gap: 12px; text-align: center; }
    .upload-box button { padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: #2d3748; color: var(--text); cursor: pointer; font-size: 1rem; }
    .upload-box button:hover { background: var(--accent); }
    video { width: 100%; border-radius: 8px; background: #000; }
    input[type="file"] { display: none; }
    .login-box input { padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-color); color: var(--text); font-size: 1rem; outline: none; direction: ltr; text-align: left; }
    .login-box input:focus { border-color: var(--accent); }
    #loginMsg { color: var(--danger); font-size: .85rem; min-height: 1.1em; }
  </style>

  <!-- Firebase (cloud sync across all devices) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, doc, getDocs, getDoc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // ⚠️ PASTE YOUR FIREBASE CONFIG HERE (Firebase Console > Project settings > Your apps > Web app)
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    if (firebaseConfig.apiKey === "YOUR_API_KEY") {
      window.cloud = null;
    } else {
      try {
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        let authResolve;
        const authReady = new Promise(r => authResolve = r);
        onAuthStateChanged(auth, u => authResolve(u));
        window.cloud = {
          waitAuth: () => Promise.race([authReady.then(() => auth.currentUser), new Promise(r => setTimeout(() => r(auth.currentUser), 6000))]),
          user: () => auth.currentUser,
          login: (email, pass) => signInWithEmailAndPassword(auth, email, pass),
          list: async (col) => (await getDocs(collection(db, col))).docs.map(d => ({ id: d.id, data: d.data() })),
          get: async (col, id) => { const s = await getDoc(doc(db, col, id)); return s.exists() ? s.data() : null; },
          set: (col, id, data) => setDoc(doc(db, col, id), data),
          del: (col, id) => deleteDoc(doc(db, col, id))
        };
      } catch (e) {
        console.error('Firebase init failed', e);
        window.cloud = null;
      }
    }
  </script>
</head>
<body>

  <div class="container">
    <header>
      <h1>نظام المراجعة المستمرة ♾️</h1>
      <p>أضف حقل تعلم جديد، ارفع صور تلخيصاتك، وراجعها بدورة لا نهائية</p>
      <div class="sync-bar">
        <button class="sync-btn" id="syncBtn" onclick="syncNow(false)" title="حفظ ومزامنة كل البيانات مع كل الأجهزة">
          <span class="ico">☁️</span><span id="syncLabel">حفظ ومزامنة</span>
        </button>
        <span class="status-badge" id="syncStatus">💾 جاري التحميل...</span>
      </div>
    </header>

    <div class="add-topic-form">
      <input type="text" id="newTopicInput" placeholder="اسم الحقل (مثال: تعلم الإنجليزية، ميديا باير...)" />
      <button class="btn" onclick="addNewTopic()">إضافة حقل</button>
    </div>

    <div class="topics-grid" id="topicsContainer"></div>
  </div>

  <div class="upload-dialog" id="uploadDialog">
    <div class="upload-box">
      <h3>اختر طريقة الرفع</h3>
      <button onclick="openLiveCamera()">📷 التقاط من الكاميرا</button>
      <button onclick="triggerFileInput()">📁 اختيار من الجهاز</button>
      <button onclick="closeUploadDialog()" style="background: transparent; border: none; color: var(--text-dim);">إلغاء</button>
    </div>
  </div>

  <div class="camera-modal" id="cameraModal">
    <div class="camera-box" style="max-width: 500px; width: 100%;">
      <h3>التقاط صورة من الكاميرا</h3>
      <video id="webcamVideo" autoplay playsinline></video>
      <canvas id="cameraCanvas" style="display: none;"></canvas>
      <div style="display: flex; gap: 10px; width: 100%; margin-top: 10px;">
        <button class="btn" style="flex: 1;" onclick="captureCameraImage()">التقاط الصورة 📸</button>
        <button class="btn" style="background: var(--danger); flex: 1;" onclick="closeLiveCamera()">إلغاء</button>
      </div>
    </div>
  </div>

  <div class="upload-dialog" id="loginDialog">
    <div class="upload-box login-box">
      <h3>تسجيل الدخول للمزامنة السحابية</h3>
      <p style="color: var(--text-dim); font-size: .85rem;">مرة واحدة فقط على كل جهاز</p>
      <input type="email" id="loginEmail" placeholder="Email" autocomplete="username" />
      <input type="password" id="loginPass" placeholder="Password" autocomplete="current-password" />
      <span id="loginMsg"></span>
      <button class="btn" id="loginBtn" onclick="doLogin()">دخول</button>
      <button onclick="closeLogin()" style="background: transparent; border: none; color: var(--text-dim);">إلغاء</button>
    </div>
  </div>

  <input type="file" id="deviceInput" accept="image/*" onchange="handleImageUpload(event)">

  <div class="modal" id="reviewModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="reviewTitle">مراجعة</h3>
        <button class="modal-close" onclick="closeReviewModal()">&times;</button>
      </div>
      <div class="modal-body" id="reviewBody"></div>
      <div class="modal-footer">
        <span id="reviewProgress" style="color: var(--text-dim); font-size: .9rem;"></span>
        <button class="btn" onclick="nextBatch()">التالي (متابعة الدورة) ♾</button>
      </div>
    </div>
  </div>

  <script>
    // ============ State ============
    const state = { topics: [], images: [], deleted: [], dirty: false, lastSync: 0 };
    let activeTopicIdForUpload = null;
    let cameraStream = null;
    let syncing = false;
    let currentReviewState = { topicId: null, images: [], currentIndex: 0, batchSize: 5, topicTitle: '' };

    const ID_RE = /^[A-Za-z0-9_\-]+$/;
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const newId = p => p + '_' + Date.now() + '_' + Math.floor(Math.random() * 100000);

    // ============ Local storage (topics/meta in localStorage, images in IndexedDB) ============
    const mem = {};
    function lsGet(k, fallback) {
      try { const v = localStorage.getItem(k); return v === null ? (k in mem ? mem[k] : fallback) : JSON.parse(v); }
      catch (e) { return k in mem ? mem[k] : fallback; }
    }
    function lsSet(k, v) {
      mem[k] = v;
      try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
    }
    function lsRemove(k) { delete mem[k]; try { localStorage.removeItem(k); } catch (e) {} }

    const IDB = {
      db: null, mem: new Map(),
      open() {
        return new Promise(res => {
          try {
            const rq = indexedDB.open('review_app', 1);
            rq.onupgradeneeded = () => rq.result.createObjectStore('images', { keyPath: 'id' });
            rq.onsuccess = () => { this.db = rq.result; res(); };
            rq.onerror = () => res();
            rq.onblocked = () => res();
          } catch (e) { res(); }
        });
      },
      all() {
        if (!this.db) return Promise.resolve([...this.mem.values()]);
        return new Promise(res => {
          try {
            const rq = this.db.transaction('images').objectStore('images').getAll();
            rq.onsuccess = () => res(rq.result || []);
            rq.onerror = () => res([]);
          } catch (e) { res([]); }
        });
      },
      put(o) {
        this.mem.set(o.id, o);
        if (!this.db) return Promise.resolve();
        return new Promise(res => {
          try {
            const tx = this.db.transaction('images', 'readwrite');
            tx.objectStore('images').put(o);
            tx.oncomplete = () => res();
            tx.onerror = () => res();
          } catch (e) { res(); }
        });
      },
      del(id) {
        this.mem.delete(id);
        if (!this.db) return Promise.resolve();
        return new Promise(res => {
          try {
            const tx = this.db.transaction('images', 'readwrite');
            tx.objectStore('images').delete(id);
            tx.oncomplete = () => res();
            tx.onerror = () => res();
          } catch (e) { res(); }
        });
      }
    };

    function saveTopics() { lsSet('local_topics', state.topics); }
    function saveDeleted() { lsSet('local_deleted', state.deleted); }
    function markDirty() { state.dirty = true; lsSet('local_dirty', true); updateSyncUI(); }
    function sortImages() { state.images.sort((a, b) => (a.createdAt - b.createdAt) || (a.id < b.id ? -1 : 1)); }

    async function loadLocal() {
      await IDB.open();
      state.topics = lsGet('local_topics', []).filter(t => t && ID_RE.test(String(t.id)));
      state.topics.forEach(t => { t.updatedAt = t.updatedAt || t.createdAt || 0; t.reviewIndex = t.reviewIndex || 0; });
      state.deleted = lsGet('local_deleted', []);
      state.dirty = !!lsGet('local_dirty', false);
      state.lastSync = lsGet('local_lastsync', 0);

      // Migrate images from the old localStorage format (if any)
      const legacy = lsGet('local_images', null);
      if (Array.isArray(legacy) && legacy.length) {
        for (const img of legacy) { if (img && ID_RE.test(String(img.id))) await IDB.put(img); }
        lsRemove('local_images');
        state.dirty = true; lsSet('local_dirty', true);
      }
      state.images = await IDB.all();
      sortImages();
    }

    // ============ Topics ============
    function addNewTopic() {
      const input = document.getElementById('newTopicInput');
      const title = input.value.trim();
      if (!title) return;
      const now = Date.now();
      state.topics.push({ id: newId('topic'), title: title.slice(0, 200), reviewIndex: 0, createdAt: now, updatedAt: now });
      saveTopics(); markDirty();
      input.value = '';
      renderTopics();
    }

    function tombstone(id) {
      if (!state.deleted.some(d => d.id === id)) state.deleted.push({ id, at: Date.now() });
    }

    async function deleteTopic(id) {
      if (!confirm('هل أنت متأكد من حذف هذا الحقل وكل الصور المرتبطة به؟')) return;
      const imgs = state.images.filter(i => i.topicId === id);
      tombstone(id);
      imgs.forEach(i => { tombstone(i.id); IDB.del(i.id); });
      state.topics = state.topics.filter(t => t.id !== id);
      state.images = state.images.filter(i => i.topicId !== id);
      saveTopics(); saveDeleted(); markDirty();
      renderTopics();
    }

    const getImagesCount = topicId => state.images.filter(i => i.topicId === topicId).length;

    function renderTopics() {
      const container = document.getElementById('topicsContainer');
      container.innerHTML = '';
      if (state.topics.length === 0) {
        container.innerHTML = '<p style="text-align:center;color:var(--text-dim);padding:20px;">لا توجد حقول قائمة حتى الآن. أضف حقل تعلم جديد للبدء!</p>';
        return;
      }
      state.topics.forEach(topic => {
        const card = document.createElement('div');
        card.className = 'topic-card';
        card.innerHTML = `
          <div class="topic-header">
            <span class="topic-title">${esc(topic.title)}</span>
            <span class="topic-counter">${getImagesCount(topic.id)} صفحة/صورة</span>
          </div>
          <div class="topic-actions">
            <button class="action-btn" title="إضافة صورة صفحة" onclick="openUploadDialog('${topic.id}')">+</button>
            <div class="review-group">
              <button class="action-btn" title="بدء المراجعة" onclick="startReview('${topic.id}')">♾️</button>
              <select class="review-select" id="batchSelect_${topic.id}">
                <option value="5" selected>5 صفح</option>
                <option value="10">10 صفح</option>
                <option value="15">15 صفحة</option>
                <option value="20">20 صفحة</option>
              </select>
            </div>
            <button class="delete-btn" onclick="deleteTopic('${topic.id}')">حذف الحقل</button>
          </div>`;
        container.appendChild(card);
      });
    }

    // ============ Upload / camera ============
    function openUploadDialog(topicId) { activeTopicIdForUpload = topicId; document.getElementById('uploadDialog').classList.add('active'); }
    function closeUploadDialog() { document.getElementById('uploadDialog').classList.remove('active'); }
    function triggerFileInput() { closeUploadDialog(); document.getElementById('deviceInput').click(); }

    async function openLiveCamera() {
      closeUploadDialog();
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
        document.getElementById('webcamVideo').srcObject = cameraStream;
        document.getElementById('cameraModal').classList.add('active');
      } catch (err) {
        alert('تعذر فتح الكاميرا! يرجى التأكد من سماح المتصفح باستخدام الكاميرا.');
      }
    }

    function closeLiveCamera() {
      if (cameraStream) { cameraStream.getTracks().forEach(t => t.stop()); cameraStream = null; }
      document.getElementById('cameraModal').classList.remove('active');
    }

    // Compress until it fits comfortably in a cloud document (limit 256 KiB)
    function compressImage(src, cb) {
      const img = new Image();
      img.onload = () => {
        let maxW = 1000, q = 0.6, out = '';
        for (let attempt = 0; attempt < 6; attempt++) {
          let w = img.width, h = img.height;
          if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
          const c = document.createElement('canvas');
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          out = c.toDataURL('image/jpeg', q);
          if (out.length < 230000) break;
          q = Math.max(0.35, q - 0.08); maxW = Math.round(maxW * 0.85);
        }
        cb(out);
      };
      img.src = src;
    }

    function captureCameraImage() {
      const video = document.getElementById('webcamVideo');
      const canvas = document.getElementById('cameraCanvas');
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
      const raw = canvas.toDataURL('image/jpeg', 0.9);
      closeLiveCamera();
      compressImage(raw, saveImage);
    }

    function handleImageUpload(event) {
      const file = event.target.files[0];
      if (!file || !activeTopicIdForUpload) return;
      const reader = new FileReader();
      reader.onload = e => { compressImage(e.target.result, saveImage); event.target.value = ''; };
      reader.readAsDataURL(file);
    }

    async function saveImage(data) {
      if (!activeTopicIdForUpload) return;
      const img = { id: newId('img'), topicId: activeTopicIdForUpload, data, createdAt: Date.now() };
      activeTopicIdForUpload = null;
      state.images.push(img);
      sortImages();
      await IDB.put(img);
      markDirty();
      renderTopics();
    }

    // ============ Review ============
    function startReview(topicId) {
      const sel = document.getElementById('batchSelect_' + topicId);
      const batchSize = parseInt(sel ? sel.value : 5);
      const images = state.images.filter(i => i.topicId === topicId);
      if (images.length === 0) { alert('لا توجد صور مضافة في هذا الحقل بعد! اضغط على زر (+) لرفع صفحات أولاً.'); return; }
      const topic = state.topics.find(t => t.id === topicId) || { title: 'مراجعة', reviewIndex: 0 };
      let startIndex = topic.reviewIndex || 0;
      if (startIndex >= images.length) startIndex = 0;
      currentReviewState = { topicId, topicTitle: topic.title, images, currentIndex: startIndex, batchSize };
      document.getElementById('reviewModal').classList.add('active');
      renderReviewBatch();
    }

    function renderReviewBatch() {
      const { images, currentIndex, batchSize, topicTitle } = currentReviewState;
      const total = images.length;
      const body = document.getElementById('reviewBody');
      body.innerHTML = '';
      document.getElementById('reviewTitle').innerText = 'مراجعة: ' + topicTitle;
      if (total === 0) {
        body.innerHTML = "<p style='color: var(--text-dim); margin: 20px;'>تم حذف جميع الصور من هذا الحقل.</p>";
        document.getElementById('reviewProgress').innerText = '0 / 0';
        return;
      }
      for (let i = 0; i < Math.min(batchSize, total); i++) {
        const item = images[(currentIndex + i) % total];
        const card = document.createElement('div');
        card.className = 'review-img-card';
        const imgEl = document.createElement('img');
        imgEl.src = item.data; imgEl.className = 'review-img';
        const delBtn = document.createElement('button');
        delBtn.className = 'img-delete-btn';
        delBtn.textContent = '🗑️ حذف هذه الصورة نهائياً';
        delBtn.onclick = () => deleteSingleImage(item.id);
        card.appendChild(imgEl); card.appendChild(delBtn);
        body.appendChild(card);
      }
      const startDisplay = currentIndex + 1;
      const endDisplay = Math.min(currentIndex + batchSize, total);
      document.getElementById('reviewProgress').innerText = `عرض الصفحات من ${startDisplay} إلى ${endDisplay} (من إجمالي ${total})`;
    }

    async function deleteSingleImage(imageId) {
      if (!confirm('هل أنت متأكد من حذف هذه الصورة نهائياً؟')) return;
      tombstone(imageId);
      state.images = state.images.filter(i => i.id !== imageId);
      await IDB.del(imageId);
      saveDeleted(); markDirty();
      currentReviewState.images = currentReviewState.images.filter(i => i.id !== imageId);
      if (currentReviewState.currentIndex >= currentReviewState.images.length) currentReviewState.currentIndex = 0;
      renderReviewBatch();
      renderTopics();
    }

    function nextBatch() {
      const { topicId, images, currentIndex, batchSize } = currentReviewState;
      const total = images.length;
      if (total === 0) return;
      const newIndex = (currentIndex + batchSize) % total;
      currentReviewState.currentIndex = newIndex;
      const t = state.topics.find(x => x.id === topicId);
      if (t) { t.reviewIndex = newIndex; t.updatedAt = Date.now(); saveTopics(); markDirty(); }
      document.getElementById('reviewBody').scrollTop = 0;
      renderReviewBatch();
    }

    function closeReviewModal() { document.getElementById('reviewModal').classList.remove('active'); }

    // ============ Cloud sync (Firebase) ============
    function getCloud() {
      return new Promise(res => {
        let n = 0;
        const t = setInterval(() => {
          if (window.cloud !== undefined || ++n > 60) { clearInterval(t); res(window.cloud || null); }
        }, 100);
      });
    }

    function setStatus(text, cls) {
      const b = document.getElementById('syncStatus');
      b.textContent = text; b.className = 'status-badge ' + (cls || '');
    }

    function updateSyncUI(busy, progressText) {
      const btn = document.getElementById('syncBtn');
      btn.disabled = !!busy;
      btn.classList.toggle('spinning', !!busy);
      btn.classList.toggle('dirty', state.dirty && !busy);
      document.getElementById('syncLabel').textContent = busy ? 'جاري المزامنة...' : (state.dirty ? 'حفظ ومزامنة *' : 'حفظ ومزامنة');
      if (busy) { setStatus(progressText || '☁️ جاري المزامنة...', 'warn'); return; }
      if (syncing) return;
      if (state.dirty) setStatus('⚠️ توجد تغييرات غير محفوظة سحابياً', 'warn');
      else if (state.lastSync) setStatus('✅ آخر مزامنة: ' + new Date(state.lastSync).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }), 'ok');
      else setStatus('💾 حفظ محلي', '');
    }

    async function runPool(tasks, limit, onProgress) {
      let i = 0, done = 0;
      const worker = async () => {
        while (i < tasks.length) {
          const t = tasks[i++];
          await t();
          onProgress && onProgress(++done, tasks.length);
        }
      };
      await Promise.all(Array.from({ length: Math.min(limit, tasks.length) }, worker));
    }

    function cleanTopic(d, id) {
      return {
        id, title: String(d.title || '').slice(0, 200),
        reviewIndex: Math.max(0, parseInt(d.reviewIndex) || 0),
        createdAt: Number(d.createdAt) || 0, updatedAt: Number(d.updatedAt) || 0
      };
    }

    // ---- Login ----
    function openLogin() { document.getElementById('loginMsg').textContent = ''; document.getElementById('loginDialog').classList.add('active'); }
    function closeLogin() { document.getElementById('loginDialog').classList.remove('active'); }
    async function doLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPass').value;
      const msg = document.getElementById('loginMsg');
      if (!email || !pass) { msg.textContent = 'اكتب الإيميل وكلمة السر'; return; }
      const btn = document.getElementById('loginBtn');
      btn.disabled = true; msg.textContent = '';
      try {
        const cloud = await getCloud();
        await cloud.login(email, pass);
        closeLogin();
        document.getElementById('loginPass').value = '';
        syncNow();
      } catch (e) {
        msg.textContent = 'الإيميل أو كلمة السر غير صحيحة';
      }
      btn.disabled = false;
    }

    // ---- Two-way merge sync ----
    async function syncNow(auto) {
      if (syncing) return;
      syncing = true;
      updateSyncUI(true, '☁️ جاري الاتصال...');
      try {
        const cloud = await getCloud();
        if (!cloud) {
          syncing = false; updateSyncUI();
          if (!auto) setStatus('⚠️ لم يتم ضبط إعدادات Firebase داخل الكود بعد', 'err');
          return;
        }
        const user = await cloud.waitAuth();
        if (!user) {
          syncing = false; updateSyncUI();
          if (!auto) openLogin();
          return;
        }

        // 1) Read what's in the cloud
        const [tList, iList, dList] = await Promise.all([cloud.list('topics'), cloud.list('imgs'), cloud.list('deleted')]);
        const rTopics = new Map(), rImgs = new Map(), rDel = new Map();
        tList.forEach(d => { if (ID_RE.test(d.id)) rTopics.set(d.id, d.data); });
        iList.forEach(d => { if (ID_RE.test(d.id)) rImgs.set(d.id, d.data); });
        dList.forEach(d => { if (ID_RE.test(d.id)) rDel.set(d.id, d.data); });

        const tasks = [];

        // 2) Deletions (applied everywhere)
        for (const d of state.deleted) if (!rDel.has(d.id)) tasks.push(() => cloud.set('deleted', d.id, { at: d.at }));
        for (const [id, d] of rDel) if (!state.deleted.some(x => x.id === id)) state.deleted.push({ id, at: Number(d.at) || Date.now() });
        const delIds = new Set(state.deleted.map(d => d.id));
        for (const id of delIds) {
          if (rTopics.has(id)) tasks.push(() => cloud.del('topics', id));
          if (rImgs.has(id)) {
            tasks.push(() => cloud.del('imgs', id));
            tasks.push(() => cloud.del('imgdata', id));
          }
        }
        state.topics = state.topics.filter(t => !delIds.has(t.id));
        const removedImgs = state.images.filter(i => delIds.has(i.id));
        state.images = state.images.filter(i => !delIds.has(i.id));
        removedImgs.forEach(i => IDB.del(i.id));

        // 3) Topics: newest edit wins
        const localTopics = new Map(state.topics.map(t => [t.id, t]));
        const allTopicIds = new Set([...localTopics.keys(), ...rTopics.keys()]);
        const topicDoc = l => ({ title: l.title, reviewIndex: l.reviewIndex, createdAt: l.createdAt, updatedAt: l.updatedAt });
        for (const id of allTopicIds) {
          if (delIds.has(id)) continue;
          const l = localTopics.get(id), rRaw = rTopics.get(id);
          if (l && !rRaw) {
            tasks.push(() => cloud.set('topics', id, topicDoc(l)));
          } else if (!l && rRaw) {
            state.topics.push(cleanTopic(rRaw, id));
          } else if (l && rRaw) {
            const r = cleanTopic(rRaw, id);
            if (l.updatedAt > r.updatedAt) tasks.push(() => cloud.set('topics', id, topicDoc(l)));
            else if (l.updatedAt < r.updatedAt) Object.assign(l, r);
          }
        }
        state.topics.sort((a, b) => a.createdAt - b.createdAt);

        // 4) Images: union of both sides
        const localImgIds = new Set(state.images.map(i => i.id));
        for (const img of state.images) {
          if (!rImgs.has(img.id)) {
            tasks.push(async () => {
              await cloud.set('imgdata', img.id, { data: img.data });   // data first, then the index entry
              await cloud.set('imgs', img.id, { topicId: img.topicId, createdAt: img.createdAt });
            });
          }
        }
        for (const [id, meta] of rImgs) {
          if (localImgIds.has(id) || delIds.has(id)) continue;
          tasks.push(async () => {
            const d = await cloud.get('imgdata', id);
            const data = d ? d.data : null;
            if (typeof data === 'string' && data.startsWith('data:image/') && ID_RE.test(String(meta.topicId))) {
              const img = { id, topicId: String(meta.topicId), data, createdAt: Number(meta.createdAt) || 0 };
              state.images.push(img);
              await IDB.put(img);
            }
          });
        }

        // 5) Run everything
        await runPool(tasks, 3, (done, total) => updateSyncUI(true, `☁️ جاري المزامنة ${done} / ${total}`));

        sortImages();
        saveTopics(); saveDeleted();
        state.dirty = false; lsSet('local_dirty', false);
        state.lastSync = Date.now(); lsSet('local_lastsync', state.lastSync);
        syncing = false;
        updateSyncUI();
        renderTopics();
        if (document.getElementById('reviewModal').classList.contains('active')) closeReviewModal();
      } catch (e) {
        syncing = false;
        updateSyncUI();
        let msg = '❌ فشلت المزامنة';
        if (e && e.code === 'permission-denied') msg = '❌ الصلاحيات: تأكد من قواعد Firestore ومن إيميلك';
        else if (e && e.code === 'resource-exhausted') msg = '❌ تم تجاوز الحد المجاني لـ Firebase مؤقتاً';
        else if (e && (e.code === 'unavailable' || !navigator.onLine)) msg = '❌ لا يوجد اتصال بالإنترنت';
        setStatus(msg, 'err');
        console.error('sync error', e);
      }
    }

    // ============ Init ============
    (async function init() {
      await loadLocal();
      renderTopics();
      updateSyncUI();
      setTimeout(() => { syncNow(true); }, 600);   // silent auto-sync on open (only if already logged in)
    })();
  </script>
