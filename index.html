<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>نظام المراجعة المستمرة</title>
  <style>
    :root {
      --bg-color: #0b132b;
      --card-bg: #1c2541;
      --accent-blue: #3a86ff;
      --text-main: #ffffff;
      --text-muted: #a0aec0;
      --danger-red: #ff0055;
      --border-color: #2a385b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo {
      font-size: 2.5rem;
      color: #7209b7;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 15px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: #1c3144;
      color: var(--accent-blue);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      border: 1px solid var(--accent-blue);
    }

    .input-section {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 650px;
      margin-bottom: 30px;
    }

    .input-section input {
      flex: 1;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      text-align: right;
    }

    .input-section input::placeholder {
      color: #6c757d;
    }

    .btn-add {
      background-color: var(--accent-blue);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn-add:hover {
      background-color: #2563eb;
    }

    .fields-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 650px;
    }

    .field-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .field-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .field-title {
      font-size: 1.25rem;
      font-weight: bold;
    }

    .field-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .field-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-delete {
      background: none;
      border: none;
      color: var(--danger-red);
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: bold;
    }

    .btn-delete:hover {
      text-decoration: underline;
    }

    .right-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    select {
      background-color: #0f172a;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      border-radius: 6px;
      outline: none;
      cursor: pointer;
    }

    .btn-icon {
      background-color: #0f172a;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 36px;
      height: 36px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">∞</div>
    <h1>نظام المراجعة المستمرة</h1>
    <p class="subtitle">أضف حقل تعلم جديد، ارفع صور تلخيصاتك، وراجعها بدورة لا نهائية</p>
    <div class="badge">
      <span>☁️</span>
      <span>التخزين المحلي مفعل لعدم ضياع البيانات</span>
    </div>
  </header>

  <div class="input-section">
    <button class="btn-add" id="addBtn">إضافة حقل</button>
    <input type="text" id="fieldNameInput" placeholder="اسم الحقل (مثال: تعلم الإنجليزية، ميديا باير...)" />
  </div>

  <div class="fields-container" id="fieldsContainer">
    <!-- الحقول تضاف هنا ديناميكياً -->
  </div>

  <script>
    // مفتاح الحفظ في LocalStorage
    const STORAGE_KEY = 'review_system_fields';

    // استرجاع البيانات المخزنة عند التحميل الأول
    let fields = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

    const fieldNameInput = document.getElementById('fieldNameInput');
    const addBtn = document.getElementById('addBtn');
    const fieldsContainer = document.getElementById('fieldsContainer');

    // حفظ القائمة في LocalStorage
    function saveToStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(fields));
    }

    // إعادة رسم الحقول في الصفحة
    function renderFields() {
      fieldsContainer.innerHTML = '';

      if (fields.length === 0) {
        fieldsContainer.innerHTML = '<div class="empty-state">لا توجد حقول حالياً. أضف حشولاً جديدة للبدء!</div>';
        return;
      }

      fields.forEach((field) => {
        const card = document.createElement('div');
        card.className = 'field-card';

        card.innerHTML = `
          <div class="field-header">
            <span class="field-meta">${field.count || 0} صفحة/صورة</span>
            <span class="field-title">${escapeHtml(field.name)}</span>
          </div>
          <div class="field-controls">
            <button class="btn-delete" onclick="deleteField('${field.id}')">حذف الحقل</button>
            <div class="right-controls">
              <select onchange="updatePages('${field.id}', this.value)">
                <option value="5" ${field.pages === '5' ? 'selected' : ''}>5 صفح</option>
                <option value="10" ${field.pages === '10' ? 'selected' : ''}>10 صفح</option>
                <option value="15" ${field.pages === '15' ? 'selected' : ''}>15 صفحة</option>
              </select>
              <button class="btn-icon">∞</button>
              <button class="btn-icon">+</button>
            </div>
          </div>
        `;

        fieldsContainer.appendChild(card);
      });
    }

    // إضافة حقل جديد
    function addField() {
      const name = fieldNameInput.value.trim();
      if (!name) return;

      const newField = {
        id: Date.now().toString(),
        name: name,
        count: 0,
        pages: '5'
      };

      fields.unshift(newField); // إدراج في البداية
      saveToStorage();
      renderFields();

      fieldNameInput.value = '';
    }

    // حذف حقل
    window.deleteField = function(id) {
      fields = fields.filter(f => f.id !== id);
      saveToStorage();
      renderFields();
    };

    // تحديث عدد الصفحات
    window.updatePages = function(id, value) {
      const field = fields.find(f => f.id === id);
      if (field) {
        field.pages = value;
        saveToStorage();
      }
    };

    // حماية الحروف الخاصة منعاً للمشاكل الأمنية
    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function(m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[m];
      });
    }

    // الأحداث
    addBtn.addEventListener('click', addField);
    fieldNameInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addField();
    });

    // العرض الأولي عند فتح الصفحة
    renderFields();
  </script>

</body>
</html>
